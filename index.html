<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f7f8fa" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self' https://*.supabase.co wss://*.supabase.co; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'"
    />
    <title>东莞市北泽五金制品有限公司 · 组织架构</title>
    <script src="./config.js"></script>
    <script type="module" src="./src/app-v1.js"></script>
    <script type="module" src="./src/pan.js"></script>
    <script type="module" src="./src/mobile-click-guard.js"></script>
  </head>
  <body>
    <div id="app" class="app-shell">
      <header class="topbar">
        <div class="brand">
          <div class="brand-logo"><img src="./kizi-flow-logo.png" alt="KIZI Flow" /></div>
          <div>
            <h1 id="org-title">东莞市北泽五金制品有限公司</h1>
            <p>组织架构管理台 · 1.0</p>
          </div>
        </div>

        <div class="topbar-actions">
          <label class="search-box" for="search-input">
            <span aria-hidden="true">⌕</span>
            <input id="search-input" type="search" placeholder="搜索部门、人员或岗位" autocomplete="off" />
          </label>
          <div id="sync-status" class="status-pill status-local" role="status" aria-live="polite">
            <span class="status-dot" aria-hidden="true"></span><span>正在初始化</span>
          </div>
          <button id="account-button" class="account-button" type="button" aria-label="编辑权限">编辑</button>
        </div>
      </header>

      <div id="offline-banner" class="banner hidden" role="status">
        <span>网络已断开。当前保持只读，恢复网络后会自动重新同步。</span>
      </div>

      <main class="workspace">
        <aside class="sidebar" aria-label="组织概览">
          <section>
            <div class="section-heading"><div><span class="eyebrow">概览</span><h2>组织统计</h2></div></div>
            <div class="stats-grid">
              <div class="stat-card"><strong id="stat-departments">0</strong><span>部门</span></div>
              <div class="stat-card"><strong id="stat-people">0</strong><span>人员</span></div>
            </div>
          </section>

          <section class="legend-section">
            <span class="eyebrow">图例</span>
            <ul class="legend-list">
              <li><span class="legend-swatch swatch-department"></span>部门</li>
              <li><span class="legend-swatch swatch-person"></span>人员</li>
            </ul>
          </section>

          <section class="sidebar-actions">
            <button id="add-root-button" class="button button-primary button-block" type="button">＋ 新增顶级部门</button>
            <button id="trash-button" class="button button-ghost button-block" type="button">回收站</button>
            <button id="history-button" class="button button-ghost button-block" type="button">历史版本</button>
          </section>

          <section class="help-card">
            <span class="eyebrow">公开页面</span>
            <p>任何拿到链接的人都可以查看组织架构。公开备注禁止填写手机号、身份证、薪资、银行卡、密码等敏感信息。</p>
          </section>
        </aside>

        <section class="canvas-panel" aria-label="组织架构图">
          <div class="canvas-toolbar">
            <div class="canvas-toolbar-primary">
              <span id="visible-count">0 个节点</span>
              <span id="filter-label" class="muted"></span>
              <span class="canvas-hint">拖动画布 · 滚轮 / 双指缩放</span>
            </div>
            <div class="canvas-toolbar-actions">
              <div class="compact-canvas-actions" aria-label="编辑操作">
                <button id="compact-add-root-button" class="button button-primary" type="button">＋ 新增部门</button>
                <button id="compact-trash-button" class="button button-ghost" type="button">回收站</button>
              </div>
              <div class="canvas-toolbar-secondary" aria-label="视图操作">
                <button id="root-button" class="button button-ghost" type="button" title="回到公司根节点"><span class="desktop-label">根节点</span></button>
                <button id="fit-button" class="button button-ghost" type="button" title="适应屏幕"><span class="desktop-label">适应</span></button>
                <button id="expand-all-button" class="button button-ghost" type="button" title="全部展开"><span class="desktop-label">展开</span></button>
                <button id="collapse-all-button" class="button button-ghost" type="button" title="收起下级"><span class="desktop-label">收起</span></button>
              </div>
              <div class="zoom-controls" aria-label="缩放控制">
                <button id="zoom-out" type="button" aria-label="缩小">−</button>
                <button id="zoom-reset" type="button" aria-label="恢复 100%"><span id="zoom-value">100%</span></button>
                <button id="zoom-in" type="button" aria-label="放大">＋</button>
              </div>
            </div>
          </div>
          <div id="tree-scroller" class="tree-scroller"><div id="tree-stage" class="tree-stage" aria-live="polite"></div></div>
        </section>

        <aside id="inspector" class="inspector" aria-label="节点编辑器">
          <div id="inspector-empty" class="inspector-empty">
            <div class="empty-icon" aria-hidden="true">↖</div>
            <h2>选择一个节点</h2>
            <p>点击部门或人员卡片查看信息；进入编辑模式后可修改。</p>
          </div>

          <form id="node-form" class="node-form hidden" onsubmit="return false">
            <div class="inspector-heading">
              <div><span class="eyebrow">节点详情</span><h2 id="inspector-title">编辑节点</h2></div>
              <button id="close-inspector" class="icon-button" type="button" aria-label="关闭编辑器">×</button>
            </div>

            <label>
              <span>类型</span>
              <select id="field-type" name="type">
                <option value="company">公司</option>
                <option value="department">部门</option>
                <option value="person">人员</option>
              </select>
            </label>
            <label><span>名称</span><input id="field-name" name="name" maxlength="80" required /></label>
            <label><span>岗位</span><input id="field-title" name="title" maxlength="120" placeholder="例如：总经理、主管、QE" /></label>
            <label><span>上级（公司 / 部门 / 人员）</span><select id="field-parent" name="parent_id"></select></label>
            <label><span>公开备注（可选）</span><textarea id="field-notes" name="notes" rows="5" maxlength="1000" placeholder="仅填写可公开的信息"></textarea></label>
            <p id="note-warning" class="public-note-warning hidden">公开页面：请勿填写手机号、身份证、薪资、银行卡、密码或其他个人敏感信息。</p>

            <div class="form-meta"><span id="updated-meta">尚未保存</span><span id="role-meta"></span></div>
            <button id="save-node-button" class="button button-primary button-block" type="button">保存修改</button>
            <div class="inspector-actions stack">
              <button id="add-child-button" class="button button-primary" type="button">＋ 添加下级部门 / 人员</button>
              <button id="move-up-button" class="button button-secondary" type="button">上移</button>
              <button id="move-down-button" class="button button-secondary" type="button">下移</button>
            </div>
            <button id="delete-node-button" class="button button-danger button-block" type="button">移入回收站</button>
          </form>
        </aside>
      </main>
    </div>

    <div id="modal-backdrop" class="modal-backdrop hidden">
      <section id="modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
        <div class="modal-heading">
          <div><span id="modal-eyebrow" class="eyebrow">操作确认</span><h2 id="modal-title">确认操作</h2></div>
          <button id="modal-close" class="icon-button" type="button" aria-label="关闭">×</button>
        </div>
        <div id="modal-content"></div>
        <div id="modal-actions" class="modal-actions"></div>
      </section>
    </div>
    <div id="toast-region" class="toast-region" aria-live="polite"></div>
  </body>
</html>
